services:
  - type: web
    name: polisrossa
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    dockerCommand: sh build-node/start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: MAIL_TRANSPORT
        value: none
      - key: REGISTRATIONS_OPEN
        value: "false"
      - key: FORUM_OPEN
        value: "false"
      - key: PUBLIC_OPERATOR_NAME
        sync: false
      - key: PUBLIC_PRIVACY_CONTACT
        sync: false
      # Add at least one complete OAuth pair in the service Environment before opening PR2:
      # DISCORD_CLIENT_ID + DISCORD_CLIENT_SECRET, or FACEBOOK_CLIENT_ID + FACEBOOK_CLIENT_SECRET.
      # Provider credentials are optional during the closed public-reading deployment.
