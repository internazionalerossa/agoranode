name: ${COMPOSE_PROJECT_NAME:-polisrossa}
services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: polisrossa
      POSTGRES_DB: polisrossa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run selfhost init first}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command: [postgres, -c, "listen_addresses=", -c, unix_socket_permissions=0777]
    volumes:
      - database:/var/lib/postgresql/data
      - socket:/var/run/postgresql
    healthcheck:
      # The official image briefly starts a temporary PostgreSQL process while
      # initializing a new volume. Only PID 1 is the final server.
      test:
        - CMD-SHELL
        - 'test "$$(head -n 1 "$$PGDATA/postmaster.pid" 2>/dev/null)" = 1 && pg_isready -h /var/run/postgresql -U polisrossa -d polisrossa'
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: "polisrossa-runtime:${COMPOSE_PROJECT_NAME:-polisrossa}"
    build:
      context: ../..
    restart: unless-stopped
    env_file: ../../.selfhost/runtime.env
    volumes:
      - socket:/var/run/postgresql:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      start_period: 90s
      retries: 5
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ../../.selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    depends_on:
      app:
        condition: service_healthy
  backup:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: [tools]
    build:
      context: .
      dockerfile: Backup.Dockerfile
    environment:
      PGHOST: /var/run/postgresql
      PGUSER: polisrossa
      PGDATABASE: polisrossa
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run selfhost init first}
    volumes:
      - socket:/var/run/postgresql:ro
      - ../../.selfhost/recipients.txt:/recipients.txt:ro
      - ../../.selfhost/backups:/backups
    depends_on:
      database:
        condition: service_healthy
  snapshot:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: [tools]
    image: "polisrossa-runtime:${COMPOSE_PROJECT_NAME:-polisrossa}"
    pull_policy: never
    network_mode: none
    entrypoint: [node, build-node/snapshot.mjs]
    environment:
      SNAPSHOT_PUBLIC_KEY: /replica/public.pem
      SNAPSHOT_DIR: /snapshots
      SNAPSHOT_REPLICA_DIR: /replica
      SNAPSHOT_RELEASE_ROOT: /app
      SNAPSHOT_NETWORK_ID: polisrossa-public
    volumes:
      - ../../.selfhost/snapshots:/snapshots:ro
      - ../../.selfhost/replica:/replica:ro
  snapshot-db:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: [tools]
    image: "polisrossa-runtime:${COMPOSE_PROJECT_NAME:-polisrossa}"
    pull_policy: never
    network_mode: none
    entrypoint: [node, build-node/snapshot.mjs]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run selfhost init first}
      SNAPSHOT_PUBLIC_KEY: /replica/public.pem
      SNAPSHOT_DIR: /snapshots
      SNAPSHOT_REPLICA_DIR: /replica
      SNAPSHOT_RELEASE_ROOT: /app
      SNAPSHOT_NETWORK_ID: polisrossa-public
    volumes:
      - socket:/var/run/postgresql:ro
      - ../../.selfhost/snapshots:/snapshots:ro
      - ../../.selfhost/replica:/replica:ro
    depends_on:
      database:
        condition: service_healthy
  snapshot-sign:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: [tools]
    image: "polisrossa-runtime:${COMPOSE_PROJECT_NAME:-polisrossa}"
    pull_policy: never
    network_mode: none
    entrypoint: [node, build-node/snapshot.mjs]
    environment:
      SNAPSHOT_PRIVATE_KEY: /snapshot-private/private.pem
      SNAPSHOT_PUBLIC_KEY: /replica/public.pem
      SNAPSHOT_DIR: /snapshots
      SNAPSHOT_REPLICA_DIR: /replica
      SNAPSHOT_RELEASE_ROOT: /app
      SNAPSHOT_NETWORK_ID: polisrossa-public
      SNAPSHOT_HEIGHT: "${SNAPSHOT_HEIGHT:-0}"
      SNAPSHOT_PREVIOUS: "${SNAPSHOT_PREVIOUS:-}"
    volumes:
      - ../../.selfhost/private/snapshot:/snapshot-private:${SNAPSHOT_PRIVATE_ACCESS:-ro}
      - ../../.selfhost/snapshots:/snapshots:${SNAPSHOT_DIR_ACCESS:-ro}
      - ../../.selfhost/replica:/replica:${SNAPSHOT_REPLICA_ACCESS:-ro}
volumes:
  database:
  socket:
  certificates:
  proxy-config:
