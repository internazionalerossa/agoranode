name: Idea / Page change
description: Suggest a feature or change a page, its layout or wording. Proponi una funzione o una modifica
  alle pagine.
title: '[Idea] '
body:
- type: markdown
  attributes:
    value: 'Write in any language. You do not need technical terms: describe the page, what you want to understand or change, and a concrete example. / Scrivi nella tua lingua: non servono termini tecnici. Indica la pagina, che cosa vorresti capire o cambiare e un esempio concreto.


      Italiano · English · Español · Français · Deutsch · Português · all other languages welcome.


      This proposal is public: omit private data and redact screenshots. / La proposta è pubblica: ometti
      dati personali e oscura gli screenshot.'
- type: input
  id: page
  attributes:
    label: Page or feature / Pagina o funzione
    description: Name the page or paste its link, if known. Indica la pagina o il link, se lo conosci.
- type: textarea
  id: proposal
  attributes:
    label: Your proposal / La tua proposta
    description: What would you change, for whom, and why? / Spiega che cosa cambieresti e quale difficoltà risolverebbe per chi usa il sito. Puoi proporre una spiegazione più chiara, un comportamento diverso o più alternative, senza preparare codice.
  validations:
    required: true
- type: textarea
  id: example
  attributes:
    label: Example / Esempio
    description: 'Optional: proposed wording, a sketch or an example. Facoltativo: testo proposto, bozza
      o esempio.'
  validations:
    required: false
