name: Verify AgoraNode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the independent application
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run synthetic lean-storage benchmark
        run: npm run benchmark:cas
      - name: Verify domain logic and persistent accounts
        run: npm test

      - name: Verify static preview build and direct-route documents
        env:
          VITE_PUBLIC_PREVIEW: 'true'
        run: |
          npx vite build --config web/vite.config.ts --outDir ../dist-preview
          node scripts/verify-static-preview.mjs
